[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "golfsim"
version = "0.1.0"
description = "Two-camera DIY golf launch monitor and ball-flight simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Raspberry Pi hardware extras (install via apt on the Pi, see docs/HARDWARE.md)
pi = ["picamera2", "gpiozero"]

[project.scripts]
golfsim-demo = "scripts.run_demo:main"
golfsim-feasibility = "scripts.feasibility_report:main"

[tool.setuptools]
packages = ["golfsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
